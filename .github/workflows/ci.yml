name: Software checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile sources
        run: python -m compileall -q bed_of_nails tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo and CLI workflows
        run: |
          python -m bed_of_nails validate bed_of_nails/demo-controller-rev-a.json
          python -m bed_of_nails scenarios
          python -m bed_of_nails demo --output demo-output
          python -m bed_of_nails compare demo-output/before.json demo-output/after.json --output demo-output/review.json
          python -m bed_of_nails summary demo-output/after.json
      - name: Report smoke test
        run: node tests/report-smoke.cjs demo-output/report.html
      - name: Packaging check
        run: |
          python -m pip install --quiet .
          bed-of-nails --version
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: demo-output
          path: demo-output
          retention-days: 14
